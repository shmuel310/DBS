    <div class="display lower" style="font-size:40px;margin-top:10px;">about this library</div>

    <p class="lead" style="margin-top:16px;font-size:15px;">I&rsquo;m Darren Rowse, a pastor at <a class="inline-link" href="https://one.org.au" target="_blank" rel="noopener noreferrer">One Church</a> in Melbourne, Australia.</p>

    <p class="lead" style="margin-top:14px;font-size:15px;">A while back I wrote a Discovery Bible Study course for our church: a simple way for anyone to read the Bible with someone else and discover it together, without needing to be an expert or have any training. It&rsquo;s a method that&rsquo;s been used all over the world, particularly in discipling people who are new to faith but curious about the Bible, and it&rsquo;s played a part in many people coming to faith in Jesus for the first time.</p>

    <p class="lead" style="margin-top:14px;font-size:15px;">When I showed it to friends in ministry, several of them wanted to use it with their own people. So I turned it into this: a small library any church or group can pick up and run, free, with no sign-up and nothing to install. I&rsquo;ve kept it deliberately brand-neutral so it can feel like yours, not ours.</p>

    <p class="lead" style="margin-top:14px;font-size:15px;">Use it freely, adapt it to your setting, and pass it on. That&rsquo;s the whole idea.</p>

    <p class="lead" style="margin-top:14px;font-size:15px;">Discovery Bible Study isn&rsquo;t something I invented. It&rsquo;s a simple, reproducible way of reading Scripture, sometimes called Discovery Bible Reading (DBR), that&rsquo;s been around for years. I&rsquo;ve just built a set of studies on top of it and tried to make them easy to use on a phone, wherever you happen to meet.</p>
