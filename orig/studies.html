// Fixed, deliberate order (not alphabetical): a gentle progression from
// first steps to going deeper.
const AUDIENCES = ["All", "Start here", "Exploring faith", "New believers", "Going deeper"];

function markSvg(size, color){
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block;color:${color};">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M30 68 Q40 40 50 50 Q60 60 70 32" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="68" r="5" fill="currentColor"/>
    <circle cx="50" cy="50" r="5" fill="currentColor"/>
    <circle cx="70" cy="32" r="5" fill="currentColor"/>
  </svg>`;
}

// Opts a standalone "I" and proper names (God, Jesus, John, etc.) out of the CSS lowercase
// transform applied to card titles, so they don't render as "god", "jesus", "john". Keep this
// word list in sync with _engine/engine.js's copy.
const PROTECTED_WORDS = ["I","God","Jesus","Christ","Lord","Abraham","Isaac","Jacob","Moses","David",
  "Daniel","Isaiah","Israel","Moab","Bethlehem","Naomi","Ruth","Boaz","Obed","Levi","Nicodemus",
  "Lazarus","Mark","John","Paul","Peter","James","Timothy","Titus","Silas","Epaphroditus","Philippi",
  "Galilee","Jerusalem","Hannah"];
const PROTECTED_WORDS_RE = new RegExp("\\b(" + PROTECTED_WORDS.join("|") + ")\\b", "g");
function titleHtml(title){ return title.replace(PROTECTED_WORDS_RE, '<span style="text-transform:none;">$1</span>'); }

function hasProgress(id){
  try { return Object.keys(JSON.parse(localStorage.getItem(`dbs.${id}.progress.v1`)) || {}).length > 0; }
  catch(e){ return false; }
}

let activeAudience = "All";

function render(){
  const filtered = activeAudience === "All" ? STUDIES : STUDIES.filter(s => s.audience.includes(activeAudience));

  const filterPills = AUDIENCES.map(a =>
    `<button class="hub-pill${a === activeAudience ? ' active' : ''}" aria-pressed="${a === activeAudience}" onclick="activeAudience='${a}';render();">${a}</button>`
  ).join("");

  const cards = filtered.map(s => `
    <a class="hub-card" href="${s.url}">
      <div class="hc-top">
        <div class="hc-cat">${s.categories.join(" &middot; ")}</div>
        ${s.audience.includes("Start here") ? `<span class="hc-badge">Start here</span>` : ""}
      </div>
      <div class="hc-title lower">${titleHtml(s.title)}</div>
      <div class="hc-sub">${s.subtitle}</div>
      <p class="hc-blurb">${s.blurb}</p>
      ${hasProgress(s.id)
        ? `<div class="hc-continue">Continue where you left off &rarr;</div>`
        : `<div class="hc-meta">${s.sessionCount} sessions${s.bonusCount ? ` &middot; ${s.bonusCount} bonus` : ""} &middot; ~${s.time} each</div>`}
    </a>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="wrap"><nav class="top">
      <a class="brand" href="index.html" aria-label="Home">
        ${markSvg(38, "var(--ink-900)")}
        <span class="brand-name">discovery bible studies</span>
      </a>
      <div class="nav-links">
        <a href="how-it-works.html">How it works</a>
        <a href="studies.html">Studies</a>
        <a href="about.html">About</a>
      </div>
    </nav></div>
    <div class="hub-wrap" style="padding-top:8px;">
      <div class="display lower" style="font-size:40px;">find a study</div>
      <p class="lead" style="margin-top:10px;max-width:480px;">Pick a study and work through it at your own pace, alone or with someone else. Every study follows the same simple rhythm: look back, look up, look forward.</p>
      <div class="hub-filters">${filterPills}</div>
      ${filtered.length ? `<div class="hub-grid">${cards}</div>` : `<p class="lead" style="margin-top:24px;">No studies match this filter yet. Try a different one, or browse all studies above.</p>`}
    </div>
  `;
}

render();
