const AUDIENCES = ["すべて", "まずはこちら", "信仰を探求する", "新しい信者", "さらに深く学ぶ"];

function markSvg(size, color){
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block;color:${color};">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M30 68 Q40 40 50 50 Q60 60 70 32" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="68" r="5" fill="currentColor"/>
    <circle cx="50" cy="50" r="5" fill="currentColor"/>
    <circle cx="70" cy="32" r="5" fill="currentColor"/>
  </svg>`;
}

function hasProgress(id){
  try { return Object.keys(JSON.parse(localStorage.getItem(`dbs.${id}.ja.progress.v1`)) || {}).length > 0; }
  catch(e){ return false; }
}

let activeAudience = "すべて";

function render(){
  const filtered = activeAudience === "すべて" ? STUDIES : STUDIES.filter(s => s.audience.includes(activeAudience));

  const filterPills = AUDIENCES.map(a =>
    `<button class="hub-pill${a === activeAudience ? ' active' : ''}" aria-pressed="${a === activeAudience}" onclick="activeAudience='${a}';render();">${a}</button>`
  ).join("");

  const cards = filtered.map(s => `
    <a class="hub-card" href="${s.url}">
      <div class="hc-top">
        <div class="hc-cat">${s.categories.join(" &middot; ")}</div>
        ${s.audience.includes("まずはこちら") ? `<span class="hc-badge">まずはこちら</span>` : ""}
      </div>
      <div class="hc-title lower">${s.title}</div>
      <div class="hc-sub">${s.subtitle}</div>
      <p class="hc-blurb">${s.blurb}</p>
      ${hasProgress(s.id)
        ? `<div class="hc-continue">前回の続きから再開 &rarr;</div>`
        : `<div class="hc-meta">${s.sessionCount} ${'ja' === 'ja' ? '回' : '次聚会'}${s.bonusCount ? ` &middot; ${s.bonusCount} ${'ja' === 'ja' ? 'ボーナス' : '延伸'}` : ""} &middot; ${s.time}</div>`}
    </a>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="wrap"><nav class="top">
      <a class="brand" href="index.html" aria-label="Home">
        ${markSvg(38, "var(--ink-900)")}
        <span class="brand-name">ディスカバリー・バイブル・スタディ</span>
      </a>
      <div class="nav-links">
        <a href="how-it-works.html">DBSとは</a>
        <a href="studies.html">スタディ一覧</a>
        <a href="../bilingual.html?lang1=ja&lang2=en">バイリンガル</a>
        <a href="about.html">このサイトについて</a>
        <div class="lang-switcher">
          <span>🌐</span>
          <select onchange="if(this.value) location.href=this.value;" aria-label="Language selector">
            <option value="../studies.html">English</option>
            <option value="../zh-hk/studies.html">繁體中文（香港）</option>
            <option value="../zh-cn/studies.html">简体中文</option>
            <option value="../ja/studies.html" selected>日本語</option>
          </select>
        </div>
      </div>
    </nav></div>
    <div class="hub-wrap" style="padding-top:8px;">
      <div class="display lower" style="font-size:40px;">スタディを探す</div>
      <p class="lead" style="margin-top:10px;max-width:480px;">スタディを選び、自分のペースで、一人でも誰かと一緒でも進められます。どのスタディも同じシンプルなリズムです：振り返る、見上げる、前を向く。</p>
      <div style="margin-top:16px;padding:14px 18px;background:var(--white);border:1px solid var(--ink-200);border-radius:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <div style="font-size:13.5px;color:var(--ink-700);">
          <strong style="color:var(--ink-900);">多言語で一緒に聖書を学びますか？</strong> 英語・繁体字・簡体字・日本語の2言語を左右に並べて同時に学べるバイリンガルモードをご利用いただけます。
        </div>
        <a href="../bilingual.html?lang1=ja&lang2=en" class="btn btn-solid" style="padding:8px 18px;font-size:13px;border-radius:999px;text-decoration:none;">バイリンガルモードを開く &rarr;</a>
      </div>
      <div class="hub-filters">${filterPills}</div>
      ${filtered.length ? `<div class="hub-grid">${cards}</div>` : `<p class="lead" style="margin-top:24px;">このフィルターに一致するスタディはまだありません。別の条件を試すか、上の「すべて」をご覧ください。</p>`}
