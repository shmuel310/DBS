    <circle cx="50" cy="50" r="5" fill="currentColor"/>
    <circle cx="70" cy="32" r="5" fill="currentColor"/>

const ICONS = {
  back: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>',
  up: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-1.5-1.2-3.6-2-6-2-1 0-2 .1-3 .4v13.6c1-.3 2-.4 3-.4 2.4 0 4.5.8 6 2 1.5-1.2 3.6-2 6-2 1 0 2 .1 3 .4V5.4C20 5.1 19 5 18 5c-2.4 0-4.5.8-6 2z"/><line x1="12" y1="7" x2="12" y2="21"/></svg>',
  forward: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 4 21 9 16 9"/></svg>'
};

document.getElementById("app").innerHTML = `
  <div class="wrap"><nav class="top">
    <a class="brand" href="index.html" aria-label="Home">
      ${markSvg(38, "var(--ink-900)")}
      <span class="brand-name">ディスカバリー・バイブル・スタディ</span>
    </a>
    <div class="nav-links">
      <a href="how-it-works.html">DBSとは</a>
      <a href="studies.html">スタディ一覧</a>
      <a href="../bilingual.html?lang1=ja&lang2=en">バイリンガル</a>
      <a href="about.html">このサイトについて</a>
      <div class="lang-switcher">
        <span>🌐</span>
        <select onchange="if(this.value) location.href=this.value;" aria-label="Language selector">
          <option value="../how-it-works.html">English</option>
          <option value="../zh-hk/how-it-works.html">繁體中文（香港）</option>
          <option value="../zh-cn/how-it-works.html">简体中文</option>
          <option value="../ja/how-it-works.html" selected>日本語</option>
        </select>
      </div>
    </div>
  </nav></div>
  <div class="wrap"><div class="screen-light" style="padding-top:8px;">
    <div class="eyebrow">進め方</div>
    <div class="display lower" style="font-size:40px;margin-top:10px;">ディスカバリー・バイブル・スタディ (DBS)</div>
    <p class="lead" style="margin-top:14px;">誰かと一緒に聖書を読む、シンプルな方法です。教えられるのではなく、グループが一緒にみことばの意味を発見していきます。専門知識も指導のトレーニングも不要。聖書を開き、いくつかの率直な問いかけをするだけです。</p>

    <!-- What it is -->
    <div class="divider-label"><span class="line"></span><span class="txt">DBSとは何か</span><span class="line"></span></div>
    <p class="lead" style="font-size:14.5px;">ディスカバリー・バイブル・スタディ（DBS：Discovery Bible Study）は、ディスカバリー・バイブル・リーディング（DBR）とも呼ばれ、世界中で用いられています。特に信仰に関心を持ち始めた人々の弟子訓練において用いられ、多くの人が初めてイエス・キリストへの信仰に至るきっかけとなってきました。一人の人が聖書を解説する代わりに、全員が同じ短い聖書箇所を読み、同じ5つの問いを一緒に深めていきます。人々が真理を自ら発見するため、よく記憶に残り、心から納得し、生活の中で実践する確率がはるかに高くなります。</p>
    <div class="memory-block" style="margin-top:16px;">
      <div class="ml">弟子とは何か？</div>
      <div class="mv">弟子とは、イエスの弟子であり、学び手であり、見習いです。イエスの方法に従い、その運動を育み、主の来臨に備えて人々を整えることによって、弟子をつくる弟子を倍増させていきます。あらゆる面で、弟子とは、よりイエスのようになっていく人のことです。</div>
      <div class="mr">Peter Roennfeldt</div>
    </div>

    <p class="lead" style="font-size:14.5px;margin-top:12px;">どのセッションも、まったく同じリズムで進みます：</p>

    <div class="card" style="margin-top:14px;">
      <span class="eyebrow" style="display:flex;align-items:center;gap:6px;color:var(--ink-700);">${ICONS.back}振り返る (Look Back)</span>
      <p style="font-size:14px;line-height:1.55;margin-top:8px;">温かく率直な近況の分かち合い。今週はどうでしたか？前回発見したことの実践や、他の人と分かち合う歩みはどうでしたか？</p>
    </div>
    <div class="card">
      <span class="eyebrow" style="display:flex;align-items:center;gap:6px;color:var(--ink-700);">${ICONS.up}見上げる (Look Up)</span>
      <p style="font-size:14px;line-height:1.55;margin-top:8px;">聖書箇所を声に出して読み、自分の言葉で言い直してから、5つの問いを用いて話し合います：何が新しかったか、何に驚いたか、理解しにくかったところ、従い実践すること、そして今週誰と分かち合うか。</p>
    </div>
    <div class="card">
      <span class="eyebrow" style="display:flex;align-items:center;gap:6px;color:var(--ink-700);">${ICONS.forward}前を向く (Look Forward)</span>
      <p style="font-size:14px;line-height:1.55;margin-top:8px;">生活の実践へとつなげます。次回までに何をしますか？そしてこの箇所を誰と分かち合いますか？この問いは、意図して毎回のセッションに含まれています。</p>
    </div>
    <p class="leader-note" style="text-align:center;">上記の5つの発見の問いは、Peter Roennfeldt 氏によって開発されました。 <a href="https://www.following-jesus.com/resources/discovery-bible-reading/" target="_blank" rel="noopener noreferrer" style="color:inherit;">彼の働きについての詳細はこちら &rarr;</a></p>

    <!-- How to use it -->
    <div class="divider-label"><span class="line"></span><span class="txt">実践のヒント</span><span class="line"></span></div>
    <div class="card">
      <ol>
        <li><span class="num dot"></span><span><strong>1対1でも、少人数グループでも。</strong> どちらでも機能します。カフェで友人と2人でも、テーブルを囲んで数人で集まっても大丈夫です。</span></li>
        <li><span class="num dot"></span><span><strong>どこでもできます。</strong> カフェ、リビングルーム、昼休みの職場。必要なのはこのアプリと聖書（または無料のYouVersion聖書アプリ）だけです。</span></li>
        <li><span class="num dot"></span><span><strong>特別な訓練は不要です。</strong> 質問自体が機能します。あなたは先生ではなく、進行をスムーズに保つ役割です。</span></li>
        <li><span class="num dot"></span><span><strong>答えがわからないときは、正直にそう言いましょう。</strong> 「良い質問ですね。メモしておいて、読み進めましょう」で十分です。あなたではなく、聖書のテキストそのものを権威とします。</span></li>
        <li><span class="num dot"></span><span><strong>常に聖書の言葉に立ち返りましょう。</strong> 議論が脱線したときは、「それはこの箇所のどこに書いてありますか？」と尋ねてみてください。</span></li>
        <li><span class="num dot"></span><span><strong>まだ納得がいかないことがあっても、議論したり論争したりしないこと。</strong> 読み進めていくうちに、自然と明確になっていくことがよくあります。</span></li>
        <li><span class="num dot"></span><span><strong>他の人を招きましょう。</strong> そして、その人たちも自分たちのグループを始められるよう励ましましょう。</span></li>
      </ol>
    </div>

    <!-- For participants -->
    <div class="divider-label"><span class="line"></span><span class="txt">参加者へのメッセージ</span><span class="line"></span></div>
    <p class="lead" style="font-size:14.5px;">聖書についての前提知識はまったく必要ありません。読みたくないのに無理に音読を求められたり、試されたりすることはありません。おかしな質問などありませんし、優等生のような正解を演じる必要もありません。好奇心を持って、率直に参加し、何が見つかるかを楽しんでください。信仰を探求し始めたばかりの方も、長年イエスに従ってきた方も、必ず心に響くものがあります。</p>

    <!-- Save to home screen -->
    <div class="divider-label"><span class="line"></span><span class="txt">スマホのホーム画面に追加する</span><span class="line"></span></div>
    <p class="lead" style="font-size:14.5px;">毎週使うツールですので、ホーム画面に追加しておくと便利です。App Storeを通さずに、アプリのようにワンタップで直接開けます。</p>
    <div class="card" style="margin-top:14px;">
      <span class="eyebrow" style="color:var(--ink-700);">iPhone の場合</span>
      <ol style="margin-top:8px;">
        <li><span class="num dot"></span><span>Safari で画面下部の<strong>共有</strong>ボタン（上向き矢印のある四角）をタップします。</span></li>
        <li><span class="num dot"></span><span>下へスクロールして<strong>ホーム画面に追加</strong>をタップします。</span></li>
        <li><span class="num dot"></span><span>右上の<strong>追加</strong>をタップします。</span></li>
      </ol>
    </div>
    <div class="card">
      <span class="eyebrow" style="color:var(--ink-700);">Android の場合</span>
      <ol style="margin-top:8px;">
        <li><span class="num dot"></span><span>Chrome で右上の<strong>メニュー</strong>（縦の3点リーダー）をタップします。</span></li>
        <li><span class="num dot"></span><span><strong>ホーム画面に追加</strong>（またはアプリをインストール）をタップします。</span></li>
        <li><span class="num dot"></span><span><strong>追加</strong>をタップして完了します。</span></li>
      </ol>
    </div>

    <div style="flex:1;"></div>
    <a class="pill solid" style="margin-top:28px;" href="studies.html">スタディを選ぶ &rarr;</a>
    <a class="pill ghost" style="margin-top:10px;" href="about.html">このライブラリについて &rarr;</a>
  </div></div>
`;
</script>
