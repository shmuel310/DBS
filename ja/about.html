    <p class="lead" style="margin-top:14px;font-size:15px;">少し前、私は自分の教会のためにディスカバリー・バイブル・スタディのコースを作成しました。専門的な知識や特別な訓練がなくても、誰でも他の人と一緒に聖書を開き、共に発見していくことができるシンプルな方法です。この手法は世界中で用いられ、特に信仰を持ち始めたばかりで聖書に関心のある人々を弟子訓練するために、また多くの人が初めてイエスへの信仰を持つきっかけとして用いられてきました。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">宣教や牧会に携わる友人たちに見せたところ、自分たちのグループでも使いたいという声が多く寄せられました。そこで、どの教会やグループでも自由に、登録もアプリのインストールも不要で使える、この小さなライブラリへと発展させました。特定の団体の色をあえて排し、誰もが自分たちのツールとして使えるように中立的なデザインにしています。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">自由にお使いいただき、それぞれの状況に合わせてアレンジし、周りの人へ手渡してください。それこそが、このツールの目指すところです。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">ディスカバリー・バイブル・スタディは、私が考案したものではありません。長年にわたり世界中で用いられてきた、シンプルで再現性のある聖書通読法（ディスカバリー・バイブル・リーディング＝DBRとも呼ばれます）です。私はその土台の上に一連のスタディを構築し、どこで集まってもスマートフォンで使いやすいように整えました。</p>
