const AUDIENCES = ["全部", "初學入門", "探索信仰", "初信栽培", "深度進深"];

function markSvg(size, color){
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block;color:${color};">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M30 68 Q40 40 50 50 Q60 60 70 32" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="68" r="5" fill="currentColor"/>
    <circle cx="50" cy="50" r="5" fill="currentColor"/>
    <circle cx="70" cy="32" r="5" fill="currentColor"/>
  </svg>`;
}

function hasProgress(id){
  try { return Object.keys(JSON.parse(localStorage.getItem(`dbs.${id}.zh-HK.progress.v1`)) || {}).length > 0; }
  catch(e){ return false; }
}

let activeAudience = "全部";

function render(){
  const filtered = activeAudience === "全部" ? STUDIES : STUDIES.filter(s => s.audience.includes(activeAudience));

  const filterPills = AUDIENCES.map(a =>
    `<button class="hub-pill${a === activeAudience ? ' active' : ''}" aria-pressed="${a === activeAudience}" onclick="activeAudience='${a}';render();">${a}</button>`
  ).join("");

  const cards = filtered.map(s => `
    <a class="hub-card" href="${s.url}">
      <div class="hc-top">
        <div class="hc-cat">${s.categories.join(" &middot; ")}</div>
        ${s.audience.includes("初學入門") ? `<span class="hc-badge">初學入門</span>` : ""}
      </div>
      <div class="hc-title lower">${s.title}</div>
      <div class="hc-sub">${s.subtitle}</div>
      <p class="hc-blurb">${s.blurb}</p>
      ${hasProgress(s.id)
        ? `<div class="hc-continue">繼續上次的進度 &rarr;</div>`
        : `<div class="hc-meta">${s.sessionCount} ${'zh-HK' === 'ja' ? '回' : '次聚会'}${s.bonusCount ? ` &middot; ${s.bonusCount} ${'zh-HK' === 'ja' ? 'ボーナス' : '延伸'}` : ""} &middot; ${s.time}</div>`}
    </a>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="wrap"><nav class="top">
      <a class="brand" href="index.html" aria-label="Home">
        ${markSvg(38, "var(--ink-900)")}
        <span class="brand-name">發現式查經</span>
      </a>
      <div class="nav-links">
        <a href="how-it-works.html">運作方式</a>
        <a href="studies.html">查經庫</a>
        <a href="../bilingual.html?lang1=zh-hk&lang2=en">雙語模式</a>
        <a href="about.html">關於</a>
        <div class="lang-switcher">
          <span>🌐</span>
          <select onchange="if(this.value) location.href=this.value;" aria-label="Language selector">
            <option value="../studies.html">English</option>
            <option value="../zh-hk/studies.html" selected>繁體中文（香港）</option>
            <option value="../zh-cn/studies.html">简体中文</option>
            <option value="../ja/studies.html">日本語</option>
          </select>
        </div>
      </div>
    </nav></div>
    <div class="hub-wrap" style="padding-top:8px;">
      <div class="display lower" style="font-size:40px;">揀選查經課程</div>
      <p class="lead" style="margin-top:10px;max-width:480px;">揀選一個課程，按照自己嘅節奏獨自閱讀或同其他人一齊進行。每個課程都遵從相同嘅簡單節奏：回顧、向上看、展望。</p>
      <div style="margin-top:16px;padding:14px 18px;background:var(--white);border:1px solid var(--ink-200);border-radius:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <div style="font-size:13.5px;color:var(--ink-700);">
          <strong style="color:var(--ink-900);">想同朋友跨語言一齊查經？</strong> 可以使用雙語對照模式，同時並排閱讀英文、繁體中文、簡體中文或日文。
        </div>
        <a href="../bilingual.html?lang1=zh-hk&lang2=en" class="btn btn-solid" style="padding:8px 18px;font-size:13px;border-radius:999px;text-decoration:none;">開啟雙語模式 &rarr;</a>
      </div>
      <div class="hub-filters">${filterPills}</div>
      ${filtered.length ? `<div class="hub-grid">${cards}</div>` : `<p class="lead" style="margin-top:24px;">暫時未有符合此篩選條件嘅課程。請嘗試其他選項，或喺上方瀏覽全部課程。</p>`}
    </div>
  `;
}
