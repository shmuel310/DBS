    <p class="lead" style="margin-top:16px;font-size:15px;">我是 Darren Rowse，澳洲墨爾本 <a class="inline-link" href="https://one.org.au" target="_blank" rel="noopener noreferrer">One Church</a> 的牧師。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">不久前，我為我們教會撰寫了一套發現式查經課程：一種讓任何人都能與其他人一同閱讀聖經、共同發現其中真理的簡單方式，無需成為聖經專家或接受任何培訓。這種方法在全球各地被廣泛使用，特別是用於門徒訓練對聖經充滿好奇的初信者，並幫助了許多人第一次認識並信從耶穌。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">當我向從事服侍的牧者朋友展示時，許多人都希望在自己的群體中使用。因此，我把它建構成了這個平台：一個任何教會或小組都能自由使用、完全免費、無需註冊且無需安裝任何軟件的精選查經庫。我刻意保持品牌中立，讓它能成為屬於你們的工具，而不僅僅屬於我們。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">請隨意使用、根據你的處境進行調整，並將它分享傳遞出去。這正是這個工具的核心初衷。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">發現式查經並不是我發明的。這是一種簡單、可持續傳遞的讀經方式，有時也稱為發現式讀經（DBR），已經存在並流傳了許多年。我只是在此基礎上精心設計了一系列查經課程，並致力於讓它們在手機上變得極易使用，無論你們在何處相聚。</p>
