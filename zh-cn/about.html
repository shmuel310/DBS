    <p class="lead" style="margin-top:16px;font-size:15px;">我是 Darren Rowse，澳大利亚墨尔本 <a class="inline-link" href="https://one.org.au" target="_blank" rel="noopener noreferrer">One Church</a> 的牧师。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">不久前，我为我们教会编写了一套发现式查经课程：一种让任何人都能与他人一同阅读圣经、共同发现其中真理的简单方式，无需成为圣经专家或接受任何培训。这种方法在全世界被广泛使用，特别适用于门训对圣经充满好奇的初信者，并帮助了许多人第一次认识并信靠耶稣。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">当我向参与服侍的牧者朋友展示时，许多人都希望在自己的群体中使用。因此，我将其搭建成了这个平台：一个任何教会或小组都能直接拿来运行、完全免费、无需注册且无需安装任何软件的轻量查经库。我特意保持了品牌的中立性，让它能成为属于你们的工具，而不仅属于我们。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">请随意使用、根据你的具体处境进行调整，并把它分享传递出去。这正是这个工具的核心初衷。</p>
    <p class="lead" style="margin-top:14px;font-size:15px;">发现式查经并不是我发明的。这是一种简单、可重复传递的读经方式，有时也称为发现式读经（DBR），已经存在并流传了许多年。我只是在此基础上精心设计了一系列查经课程，并致力于让它们在手机上变得极易使用，无论你们在何处相聚。</p>
